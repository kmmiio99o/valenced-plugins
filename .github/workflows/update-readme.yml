# Regenerates the README plugin/theme tables from each manifest.json and commits the result.
#
# Run it yourself with `bun run update-readme`, or let this workflow do it on every push
# that touches a manifest. The commit message carries [skip ci] so it does not re-trigger
# the release workflow.

name: Update README

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/manifest.json'
      - 'themes/**/manifest.json'
      - '.github/scripts/update-readme.ts'
  workflow_dispatch:

# Never two README commits racing on the same branch.
concurrency:
  group: update-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The script reads local manifest.json files only: no install, no network.
      - name: Regenerate README tables
        run: bun .github/scripts/update-readme.ts

      - name: Commit the result
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: regenerate README tables [skip ci]"
          git push
